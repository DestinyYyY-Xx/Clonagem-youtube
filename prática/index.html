<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube 3,14x melhor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <div class="cabecalho-inicio">
            <i class="fa-solid fa-bars"></i>

            <div class="logotipo">
                <a href="https://youtube.com"><i class="fa-brands fa-youtube logotipo-icon"></i></a>
                <span class="logotipo-nome">Youtube</span>
                <span class="logotipo-pais">BR</span>
            </div>

        </div>

        <div class="cabecalho-central">
            <div class="search">
                <input type="text" name="search" id="search-input" class="search-input">
                <button class="search-button">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <button class="microphone">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>
        
        <div class="cabecalho-final">
            <button class="logotipo-video" title="Criar">
                <i class="fa-solid fa-video"></i>
            </button>
            <button class="logotipo-video" title="Notifications">
                <i class="fa-solid fa-bell"></i>
            </button>
            <button class="logotipo-video" title="Sua conta">
                <i class="fa-solid fa-user"></i>
            </button>
        </div>
    </header>
    
    <main class="principal">
        <div class="principal-sidebar">
            <div class="sidebar-inicio">
                <a>
                    <i class="fa-solid fa-house"></i>
                    <span>Início</span>
                </a>

                <a>
                    <i class="fa-solid fa-clapperboard"></i>
                    <span>Shorts</span>
                </a>

                <a>
                    <i class="fa-solid fa-square-rss"></i>
                    <span>Inscrições</span>
                </a>
            </div>

            <div class="sidebar-centro">
                <span class="sidebar-centro-titulo">Você</span>
                <a>
                    <i class="fa-solid fa-user"></i>
                    <span>Seu canal</span>
                </a>

                <a>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Histórico</span>
                </a>

                <a>
                    <i class="fa-solid fa-list"></i>
                    <span>Playlists</span>
                </a>
            
                <a>
                    <i class="fa-solid fa-video"></i>
                    <span>Seus videos</span>
                </a>
            
                <a>
                    <i class="fa-solid fa-clock"></i>
                    <span>Assistir mais tarde</span>
                </a>

                <a>
                    <i class="fa-solid fa-thumbs-up"></i>
                    <span>Vídeos curtidos</span>
                </a>
            </div>

            <div class="sidebar-final"></div>
        </div>

        <div class="principal-video">b</div>

        <div class="principal-recomendados">c</div>
    </main>

    <script src="script.js"></script>
</body>
</html>
